/* layout: framed sea window on the left, tackle-shop ledger on the right; stacks on phones */
:root {
  --abyss: #0a1726;
  --hull: #102438;
  --hull-2: #15304a;
  --line: #24496b;
  --foam: #e6f0ef;
  --mist: #9bb4c3;
  --brass: #e2b04a;
  --brass-deep: #a97a22;
  --coral: #f07560;
  --kelp: #62c79b;
  --violet: #b9a6f5;
  --display: 'Do Hyeon', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;

  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {

  color: var(--foam);
  font-family: var(--body);
  font-size: 15px;

}
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

.app {
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px 20px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { width: 26px; height: 26px; flex: none; }
.brand h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 28px; line-height: 1; letter-spacing: .02em; }
.brand small { display: block; font-size: 12px; color: var(--mist); letter-spacing: .04em; margin-top: 2px; }
.chips { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.chip {
  display: flex; align-items: baseline; gap: 6px;
  padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--hull); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.chip b { font-family: var(--display); font-weight: 400; font-size: 18px; }
.chip-label { font-size: 12px; color: var(--mist); letter-spacing: .04em; }
.chip.gold b { color: var(--brass); }
.coin { width: 13px; height: 13px; border-radius: 50%; align-self: center; background: radial-gradient(circle at 35% 35%, #ffe7a6, var(--brass) 55%, var(--brass-deep)); }
.ghost {
  padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
  background: transparent; color: var(--mist); cursor: pointer; font-size: 13px;
}
.ghost:hover { color: var(--foam); border-color: var(--mist); }

.layout { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; }
.stage {
  position: relative; min-width: 0; min-height: 360px;
  border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: #0d2a44;
}
.stage:has(#game:focus-visible) { outline: 2px solid var(--brass); outline-offset: 2px; }
#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; outline: none; -webkit-user-select: none; user-select: none; }
.hint {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);

  padding: 7px 16px; border-radius: 999px;
  background: rgba(6, 16, 28, .74); color: var(--foam);
  font-size: 14px; text-align: center; pointer-events: none;
}
.hint.urgent { background: var(--brass); color: #1d1405; font-family: var(--display); font-size: 20px; padding: 4px 20px; }
.hint.danger { background: var(--coral); color: #250a05; font-family: var(--display); font-size: 18px; }
.stage { container-type: inline-size; }
.toasts {
  position: absolute; top: 12px; left: 176px; right: 60px;

.toasts .toast { max-width: 380px; }

.toast {

}
.toast.bad { border-color: rgba(240, 117, 96, .6); }

.toast.good { border-color: rgba(98, 199, 155, .6); }

.toast.monster { border-color: rgba(185, 166, 245, .7); }

.toast.catch { border-color: var(--brass); padding: 12px 16px; }
.toast .t-kicker { font-size: 12px; color: var(--mist); letter-spacing: .06em; display: flex; justify-content: center; gap: 6px; align-items: center; }
.toast .t-name { font-family: var(--display); font-size: 26px; line-height: 1.15; }
.toast .t-meta { font-variant-numeric: tabular-nums; }

.tag { display: inline-block; padding: 0 7px; border-radius: 6px; font-size: 11px; line-height: 18px; letter-spacing: .04em; }

.tag.mon { background: rgba(185, 166, 245, .18); color: var(--violet); border: 1px solid rgba(185, 166, 245, .45); }
.tag.boss { background: rgba(240, 117, 96, .18); color: var(--coral); border: 1px solid rgba(240, 117, 96, .5); }
.toast.leaving { opacity: 0; transform: translateY(-6px); transition: opacity .3s, transform .3s; }

.panel { min-width: 0; min-height: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 16px; background: var(--hull); overflow: hidden; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button {

.tabs button span { font-family: var(--body); font-size: 12px; color: var(--mist); }
.tabpanel { flex: 1; min-height: 0; overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }

.item { padding: 14px; border-radius: 12px; background: var(--hull-2); display: flex; flex-direction: column; gap: 10px; }
.item.hero { border: 1px solid rgba(226, 176, 74, .45); }
.item-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.item-head h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 20px; }

.stats { margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px; }
.stats div { min-width: 0; }
.stats dt { font-size: 12px; color: var(--mist); }
.stats dd { margin: 0; font-variant-numeric: tabular-nums; }
.stats dd em { font-style: normal; color: var(--kelp); }

.buy span { font-variant-numeric: tabular-nums; white-space: nowrap; }
.buy:hover:not(:disabled) { background: #edc164; }
.buy:disabled { background: var(--line); color: var(--mist); cursor: not-allowed; }
.buy.maxed { background: transparent; border: 1px dashed var(--line); color: var(--mist); justify-content: center; }

.zone-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 4px; }
.zone-head h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 18px; }
.zone-head span { font-size: 12px; color: var(--mist); font-variant-numeric: tabular-nums; }
.zone-note { margin: -6px 0 0; font-size: 12px; color: var(--coral); }
.dex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
.dex-card { padding: 8px; border-radius: 10px; background: var(--hull-2); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.dex-card canvas { width: 100%; height: 56px; display: block; }
.dex-name { font-size: 13px; line-height: 1.3; overflow-wrap: anywhere; }
.dex-meta { font-size: 11px; color: var(--mist); font-variant-numeric: tabular-nums; }
.dex-card.locked .dex-name { color: var(--mist); }

.log { margin: 0; display: grid; gap: 0; }
.log div { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.log dt { color: var(--mist); }
.log dd { margin: 0; font-variant-numeric: tabular-nums; text-align: right; }
.howto { padding: 12px 14px; border-radius: 12px; background: var(--hull-2); font-size: 13px; color: var(--mist); }
.howto h3 { margin: 0 0 6px; font-family: var(--display); font-weight: 400; font-size: 17px; color: var(--foam); }
.howto ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }

.danger-btn { padding: 9px 12px; border-radius: 10px; border: 1px solid rgba(240, 117, 96, .5); background: transparent; color: var(--coral); cursor: pointer; }
.danger-btn.armed { background: var(--coral); color: #250a05; }

@media (max-width: 880px) {
  .app { height: auto; min-height: 100%; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  .stage { height: 64vh; height: 64svh; min-height: 340px; max-height: 620px; }
  .tabpanel { overflow: visible; }

@media (max-width: 520px) {
  .brand h1 { font-size: 24px; }

@media (prefers-reduced-motion: reduce) {
  .toast { animation: none; }
}
</style>

/* ---------- monster raid ---------- */

  }

}

}

  }

}

/* ---------- main update ---------- */
function update(dt) {
  G.t += dt;
  switch (G.state) {
    case 'charging': { G.chargeT += dt; const p = (G.chargeT / 1.6) % 1; G.charge = p < 0.5 ? p * 2 : 2 - p * 2; break; }
    case 'casting': {
      const c = G.cast; c.t += dt / 0.6; const u = Math.min(1, c.t);
      G.hook.x = lerp(c.x0, c.x1, u); G.hook.y = lerp(c.y0, 0, u) - Math.sin(Math.PI * u) * 90;
      if (c.t >= 1) { G.state = 'sinking'; splash(G.hook.x, 0, 14); SFX.splash(); }
      break;
    }
    case 'sinking': {
      const ty = G.target * PX, v = Math.max(22, G.target * 0.45) * PX;
      G.hook.y = Math.min(ty, G.hook.y + v * dt); G.hook.x += Math.sin(G.t * 1.2) * 6 * dt;
      if (Math.random() < dt * 4) bubble(G.hook.x, G.hook.y);
      if (G.hook.y >= ty) G.state = 'waiting';
      break;
    }
    case 'waiting': {
      if (G.holding) {
        G.hook.y -= 22 * PX * dt;
        if (G.hook.y <= 0) { G.state = 'idle'; splash(G.hook.x, 0, 6); clearInterest(); break; }
      }
      G.hook.x += Math.sin(G.t * 0.9) * 5 * dt;
      const f = checkBites();
      if (f && approach(f, dt)) { G.state = 'bite'; G.bite = { f, t: 0.85 + 0.05 * S.bait }; SFX.bite(); }
      break;
    }
    case 'bite': {
      const b = G.bite; b.t -= dt;
      if (b.t <= 0) {
        b.f.interested = false; b.f.flee = true; b.f.dir *= -1; G.bite = null; G.state = 'waiting'; SFX.miss();
        toast('미끼만 뜯기고 놓쳤어요. <b>느낌표가 뜨면 바로 누르세요.</b>', 'bad', 2600);
      }
      break;
    }
    case 'fight': updateFight(dt); break;
    case 'landing': updateLanding(dt); break;
    case 'raid': updateRaid(dt); break;
  }
  if (G.state === 'idle' || G.state === 'charging') { const tip = rodTip(); G.hook.x = tip.x + Math.sin(G.t * 2) * 2; G.hook.y = tip.y + 30; }
  if ((G.state === 'idle' || G.state === 'waiting' || G.state === 'sinking') && S.stats.catches >= 3) {

  if (G.trophy) { G.trophy.t += dt / 0.7; if (G.trophy.t >= 1) G.trophy = null; }
  updateFish(dt); spawnFish(dt); updateParts(dt);
  const prevCam = G.camY;
  G.camY = lerp(G.camY, camTarget(), 1 - Math.pow(0.03, dt));
  const dc = G.camY - prevCam;
  for (const p of G.snow) { p.y += (p.s * dt - dc * 0.6) / Math.max(1, H); p.x += Math.sin(G.t * 0.5 + p.s) * 0.002 * dt; p.y = ((p.y % 1) + 1) % 1; }
  G.shake = Math.max(0, G.shake - dt);
  G.rodKick = Math.max(0, G.rodKick - dt * 3);
  updateHint();
}

  $('panel-log').innerHTML = `
    <div class="howto"><h3>조작법</h3><ul>
      <li><b>꾹 눌렀다 떼기</b> · 게이지만큼 깊이 던져요</li>
      <li><b>느낌표가 뜨면 누르기</b> · 챔질해서 바늘을 걸어요</li>
      <li><b>누르면 감고 떼면 풀기</b> · 장력 바늘을 초록 구간에 맞추면 체력이 빨리 깎여요</li>
      <li><b>빨간 구간</b>까지 올라가면 줄이 끊어지고, 오래 느슨하면 도망가요</li>
      <li><b>몸부림 !!</b> 표시가 뜨면 잠깐 손을 떼세요</li>
    </ul></div>
    <dl class="log">
      <div><dt>낚은 수</dt><dd>${fmtN(st.catches)}마리</dd></div>
      <div><dt>몬스터 격퇴</dt><dd>${fmtN(st.monsters)}마리</dd></div>
      <div><dt>가장 무거운 수확</dt><dd>${big ? `${SP[big.id].name} ${fmtW(big.w)}` : '아직 없음'}</dd></div>
      <div><dt>가장 깊은 수확</dt><dd>${st.deepest}m</dd></div>
      <div><dt>번 금화</dt><dd>${fmtN(st.earned)} G</dd></div>
      <div><dt>끊어진 줄 · 놓친 고기</dt><dd>${st.snaps}번 · ${st.escapes}번</dd></div>
      <div><dt>습격 방어</dt><dd>${st.raidsWon}승 ${st.raidsLost}패</dd></div>
    </dl>
    <button type="button" class="danger-btn ${resetArmed ? 'armed' : ''}" id="resetBtn">${resetArmed ? '한 번 더 누르면 모든 기록이 지워져요' : '처음부터 다시 하기'}</button>`;
}
function renderAll() { renderHeader(); renderShop(); renderLog(); if (!$('panel-dex').hidden) renderDex(); else dexDirty = true; }
let dexDirty = true;

document.querySelector('.panel').addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) {
    for (const b of document.querySelectorAll('[data-tab]')) {
      const on = b === tab; b.setAttribute('aria-selected', String(on)); $('panel-' + b.dataset.tab).hidden = !on;
    }
    if (tab.dataset.tab === 'dex' && dexDirty) { renderDex(); dexDirty = false; }
    try { localStorage.setItem(KEY + '-tab', tab.dataset.tab); } catch (_) {}
    return;
  }
  const b = e.target.closest('[data-buy]');
  if (b) { buy(b.dataset.buy); b.blur(); return; }
  if (e.target.closest('#resetBtn')) {
    if (!resetArmed) { resetArmed = true; renderLog(); setTimeout(() => { if (resetArmed) { resetArmed = false; renderLog(); } }, 4000); return; }
    resetArmed = false; const snd = S.sound; S = fresh(); S.sound = snd; save();
    G.state = 'idle'; G.fight = null; G.bite = null; G.raid = null; G.raidCd = rand(80, 140);
    renderAll(); renderDex(); toast('<b>새 출발!</b> 대나무 낚싯대 하나로 다시 시작해요.', 'good');
  }
});
function buy(kind) {
  ensureAudio();
  if (kind === 'rod') {
    const nx = RODS[S.rod + 1]; if (!nx || S.gold < nx.cost) return;
    S.gold -= nx.cost; S.rod++;
    toast(`<b>${nx.name}</b> 장착! 이제 ${nx.depth}m까지 던질 수 있어요.`, 'good', 3000);
  } else {
    const u = UPG[kind], lv = S[kind]; if (lv >= u.max) return;
    const cost = u.cost(lv); if (S.gold < cost) return;
    S.gold -= cost; S[kind]++;
    toast(`<b>${u.title} 강화</b> Lv.${S[kind]}`, 'good', 2000);
  }
  SFX.buy(); save(); renderAll(); dexDirty = true;
}
$('soundBtn').addEventListener('click', e => { S.sound = !S.sound; ensureAudio(); save(); renderHeader(); e.currentTarget.blur(); });

/* ---------- boot ---------- */
renderAll();
try { const tb = localStorage.getItem(KEY + '-tab'); if (tb && tb !== 'shop') document.querySelector(`[data-tab="${tb}"]`)?.click(); } catch (_) {}
G.camY = camTarget();
for (let i = 0; i < 6; i++) spawnAt(rand(3, Math.max(8, (G.camY + H) / PX - 4)), rand(40, W - 40));
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>

</body></html>
